sentence=ILI9341 / ST7789 display + XPT2046 touch driver for the ESP32-32E 2.8" touch LCD (CYD family, with battery)
paragraph=Self-contained display and resistive-touch driver for the generic ESP32 2.8" touch LCD whose PCB silkscreen reads ESP32-32E 240x320 Resistance Touch (sold by several vendors): a Cheap-Yellow-Display-family board with USB-C, a battery connector, TP4054 charger and a switchable audio amplifier. Detects and drives either 240x320 SPI panel the board ships with (ILI9341 or ST7789) via the ESP-IDF SPI master driver and reads the XPT2046 resistive touch controller on its own SPI pins. Ships LVGL 9.3 examples with display, touch, and LVGL plumbing already wired up: a hand-written Claude Code stub, a SquareLine Studio launcher, bouncing-balls and calculator demos, an MP3 player that plays from the TF card through the on-board speaker amplifier, and a touch calibration tool.
